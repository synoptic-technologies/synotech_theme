[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "synotech_theme"
version = "0.1.0"
description = "Synotech surface theme for Frappe/ERPNext"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []

[project.urls]
Homepage = "https://github.com/synoptic-technologies/synotech_theme"

[tool.setuptools.packages.find]
where = ["."]
include = ["synotech_theme*"]
